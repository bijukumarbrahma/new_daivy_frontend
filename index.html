<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daivy AI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">

  <!-- Markdown + Syntax highlighting -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" id="hljs-theme">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<style>
/* ─── Reset ────────────────────────────────────────────── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

/* ─── Variables ─────────────────────────────────────────── */
:root {
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'DM Sans', system-ui, sans-serif;

  --bg-primary:   #070b14;
  --bg-secondary: #0b1020;
  --bg-card:      #111827;
  --bg-glass:     rgba(11, 16, 32, 0.72);
  --border:       rgba(255,255,255,0.07);
  --border-accent:rgba(0,212,170,0.28);

  --text-primary:   #eef2ff;
  --text-secondary: #7b89a8;
  --text-muted:     #3d4a63;

  --accent:       #00d4aa;
  --accent-dim:   rgba(0,212,170,0.10);
  --accent-glow:  rgba(0,212,170,0.20);
  --accent-strong:rgba(0,212,170,0.35);

  --user-bubble:        #1a3a8f;
  --user-bubble-border: rgba(59,130,246,0.25);
  --ai-bubble:          transparent;

  --shadow-sm:  0 1px 3px rgba(0,0,0,.12);
  --shadow-md:  0 8px 32px rgba(0,0,0,.35);
  --shadow-lg:  0 20px 60px rgba(0,0,0,.55);
  --shadow-accent: 0 0 40px rgba(0,212,170,0.12);

  --nav-bg:      rgba(7,11,20,0.85);
  --sidebar-bg:  #090d1a;
  --scrollbar:   #141c2e;
  --scrollbar-thumb: #253047;

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --t-fast: 0.14s ease;
  --t-normal: 0.22s ease;
  --sidebar-w: 264px;
}

[data-theme="light"] {
  --bg-primary:   #f3f6fd;
  --bg-secondary: #ebeffa;
  --bg-card:      #ffffff;
  --bg-glass:     rgba(255,255,255,0.80);
  --border:       rgba(0,0,0,0.08);
  --border-accent:rgba(0,180,140,0.28);

  --text-primary:   #0d1526;
  --text-secondary: #4a5578;
  --text-muted:     #9aa3b8;

  --accent:       #008870;
  --accent-dim:   rgba(0,136,112,0.08);
  --accent-glow:  rgba(0,136,112,0.16);
  --accent-strong:rgba(0,136,112,0.30);

  --user-bubble:        #1a5fd4;
  --user-bubble-border: rgba(26,95,212,0.18);

  --shadow-md:  0 8px 32px rgba(0,0,0,0.10);
  --shadow-lg:  0 20px 60px rgba(0,0,0,0.10);
  --shadow-accent: 0 0 40px rgba(0,136,112,0.08);

  --nav-bg:      rgba(243,246,253,0.90);
  --sidebar-bg:  #eaedfa;
  --scrollbar:   #d8dff0;
  --scrollbar-thumb: #b0bcd8;
}

/* ─── Base ───────────────────────────────────────────────── */
html, body {
  height: 100dvh;
  font-family: var(--font-body);
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.65;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  transition: background var(--t-normal), color var(--t-normal);
}
::selection { background: var(--accent); color: #000; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--scrollbar); }
::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }

/* ─── Layout ─────────────────────────────────────────────── */
.app-container {
  display: flex;
  height: 100dvh;
  width: 100vw;
  overflow: hidden;
  position: relative;
}

/* ─── Sidebar ────────────────────────────────────────────── */
.sidebar {
  width: var(--sidebar-w);
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  z-index: 200;
  position: relative;
  transition: transform var(--t-normal), background var(--t-normal);
  overflow: hidden;
}

.sidebar-header {
  padding: 20px 16px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}

.logo-mark {
  width: 34px;
  height: 34px;
  background: linear-gradient(135deg, var(--accent) 0%, #0085ff 100%);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 20px var(--accent-glow);
  flex-shrink: 0;
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
  color: #000;
  letter-spacing: -0.03em;
}

.logo-name {
  font-family: var(--font-display);
  font-size: 1.1rem;
  font-weight: 400;
  color: var(--text-primary);
  letter-spacing: -0.02em;
}

.new-chat-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 14px;
  background: transparent;
  border: 1px dashed var(--border);
  border-radius: 10px;
  color: var(--text-muted);
  font-family: var(--font-body);
  font-size: 13px;
  cursor: pointer;
  transition: border-color var(--t-normal), color var(--t-normal), background var(--t-normal);
  width: 100%;
}
.new-chat-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
.new-chat-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

.chat-history { flex: 1; overflow-y: auto; padding: 6px 8px 12px; }

.history-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 14px 10px 6px;
}

.history-list { list-style: none; display: flex; flex-direction: column; gap: 2px; }

.history-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 13px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: background var(--t-fast), color var(--t-fast);
  position: relative;
}
.history-item:hover, .history-item.active {
  background: var(--accent-dim);
  color: var(--text-primary);
}
.history-item svg { width: 14px; height: 14px; flex-shrink: 0; opacity: 0.6; }
.history-item span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.history-item .del-btn {
  margin-left: auto;
  padding: 2px 5px;
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  border-radius: 4px;
  font-size: 12px;
  opacity: 0;
  transition: opacity var(--t-fast), color var(--t-fast);
  flex-shrink: 0;
}
.history-item:hover .del-btn { opacity: 1; }
.history-item .del-btn:hover { color: #f87171; }

.sidebar-footer {
  padding: 14px 12px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.sidebar-action-btn {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 10px;
  background: transparent;
  border: none;
  border-radius: 8px;
  color: var(--text-muted);
  font-family: var(--font-body);
  font-size: 13px;
  cursor: pointer;
  transition: all var(--t-fast);
  width: 100%;
}
.sidebar-action-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
.sidebar-action-btn:hover { background: var(--accent-dim); color: var(--text-secondary); }
.sidebar-action-btn.danger:hover { background: rgba(248,113,113,0.08); color: #f87171; }

/* ─── Main Content ───────────────────────────────────────── */
.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  position: relative;
  overflow: hidden;
}

/* Background grid + glow */
.main-content::before {
  content: '';
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 54px 54px;
  mask-image: radial-gradient(ellipse 80% 55% at 50% 15%, black, transparent);
  -webkit-mask-image: radial-gradient(ellipse 80% 55% at 50% 15%, black, transparent);
}
.main-content::after {
  content: '';
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 60% 50% at 50% 0%, rgba(0,212,170,0.07), transparent 70%),
    radial-gradient(ellipse 35% 30% at 85% 70%, rgba(0,120,255,0.05), transparent 70%);
}
[data-theme="light"] .main-content::after {
  background:
    radial-gradient(ellipse 60% 50% at 50% 0%, rgba(0,136,112,0.06), transparent 70%),
    radial-gradient(ellipse 35% 30% at 85% 70%, rgba(0,120,255,0.04), transparent 70%);
}

/* ─── Chat Header ────────────────────────────────────────── */
.chat-header {
  height: 58px;
  padding: 0 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--border);
  background: var(--nav-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  flex-shrink: 0;
  position: relative;
  z-index: 10;
  transition: background var(--t-normal);
}

.menu-toggle {
  display: none;
  width: 34px; height: 34px;
  align-items: center; justify-content: center;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 50%;
  color: var(--text-secondary);
  cursor: pointer;
  flex-shrink: 0;
  transition: border-color var(--t-fast), color var(--t-fast);
}
.menu-toggle:hover { border-color: var(--accent); color: var(--accent); }
.menu-toggle svg { width: 16px; height: 16px; }

.header-center {
  flex: 1;
  display: flex;
  justify-content: center;
}

.model-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: var(--accent-dim);
  border: 1px solid var(--border-accent);
  border-radius: 100px;
  padding: 5px 14px;
  font-size: 12px;
  color: var(--accent);
  font-weight: 500;
  letter-spacing: 0.01em;
  cursor: default;
}

.pulse-dot {
  width: 6px; height: 6px;
  background: var(--accent);
  border-radius: 50%;
  animation: pulse-green 2.4s ease-in-out infinite;
}
@keyframes pulse-green {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.75); }
}

.header-actions { display: flex; gap: 8px; align-items: center; }

.icon-btn {
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 50%;
  color: var(--text-secondary);
  cursor: pointer;
  transition: border-color var(--t-fast), color var(--t-fast), background var(--t-fast);
  flex-shrink: 0;
}
.icon-btn svg { width: 15px; height: 15px; }
.icon-btn:hover { border-color: var(--border-accent); color: var(--accent); background: var(--accent-dim); }

/* ─── Chat Container ─────────────────────────────────────── */
.chat-container {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 1;
  scroll-behavior: smooth;
}

/* ─── Welcome Screen ─────────────────────────────────────── */
.welcome-screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 24px 48px;
  text-align: center;
}

.welcome-icon {
  width: 68px; height: 68px;
  background: linear-gradient(135deg, var(--accent) 0%, #0085ff 100%);
  border-radius: 20px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 28px;
  box-shadow: 0 0 50px var(--accent-glow), var(--shadow-md);
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 700;
  color: #000;
  animation: welcomeFloat 3.5s ease-in-out infinite;
}
@keyframes welcomeFloat {
  0%, 100% { transform: translateY(0); box-shadow: 0 0 50px var(--accent-glow), var(--shadow-md); }
  50% { transform: translateY(-6px); box-shadow: 0 0 70px var(--accent-strong), var(--shadow-lg); }
}

.welcome-screen h1 {
  font-family: var(--font-display);
  font-size: clamp(2rem, 5vw, 3rem);
  font-weight: 300;
  line-height: 1.12;
  letter-spacing: -0.03em;
  color: var(--text-primary);
  margin-bottom: 14px;
  animation: fadeUp 0.55s 0.05s ease both;
}

.welcome-screen p {
  font-size: 0.975rem;
  color: var(--text-secondary);
  font-weight: 300;
  max-width: 400px;
  margin: 0 auto 40px;
  animation: fadeUp 0.55s 0.12s ease both;
}

.suggestion-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  max-width: 560px;
  width: 100%;
  animation: fadeUp 0.55s 0.20s ease both;
}

.suggestion-card {
  background: var(--bg-glass);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 16px;
  text-align: left;
  cursor: pointer;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-family: var(--font-body);
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 400;
  line-height: 1.45;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: border-color var(--t-normal), background var(--t-normal), transform 0.15s, color var(--t-normal);
}
.suggestion-card:hover {
  border-color: var(--border-accent);
  background: var(--accent-dim);
  color: var(--text-primary);
  transform: translateY(-2px);
}
.suggestion-card svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--accent); margin-top: 1px; }
.suggestion-card .card-title { font-weight: 500; color: var(--text-primary); font-size: 13px; margin-bottom: 3px; }
.suggestion-card .card-sub { font-size: 12px; color: var(--text-muted); }

/* ─── Messages ───────────────────────────────────────────── */
.messages-container {
  display: none;
  flex-direction: column;
  padding: 24px 0 32px;
}
.messages-container.visible { display: flex; }

.message {
  display: flex;
  padding: 5px 20px;
  animation: fadeUp 0.22s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.message.user { justify-content: flex-end; }
.message.ai   { justify-content: flex-start; align-items: flex-start; }

.ai-avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent) 0%, #0085ff 100%);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  margin-right: 10px;
  margin-top: 4px;
  box-shadow: 0 0 14px var(--accent-glow);
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 700;
  color: #000;
}

.msg-wrap { display: flex; flex-direction: column; max-width: min(72%, 700px); }

.message.user .msg-wrap { align-items: flex-end; }
.message.ai  .msg-wrap { align-items: flex-start; }

.message-bubble {
  padding: 11px 16px;
  font-size: 14.5px;
  line-height: 1.68;
  word-break: break-word;
}

.message.user .message-bubble {
  background: var(--user-bubble);
  border: 1px solid var(--user-bubble-border);
  border-radius: 18px 18px 5px 18px;
  color: #eef2ff;
}

.message.ai .message-bubble {
  background: transparent;
  color: var(--text-primary);
  padding-left: 0;
}

/* Markdown styles inside AI bubbles */
.message.ai .message-bubble p  { margin-bottom: 10px; }
.message.ai .message-bubble p:last-child { margin-bottom: 0; }

.message.ai .message-bubble h1,
.message.ai .message-bubble h2,
.message.ai .message-bubble h3 {
  font-family: var(--font-display);
  font-weight: 400;
  letter-spacing: -0.02em;
  margin: 14px 0 8px;
  color: var(--text-primary);
}
.message.ai .message-bubble h1 { font-size: 1.4rem; }
.message.ai .message-bubble h2 { font-size: 1.2rem; }
.message.ai .message-bubble h3 { font-size: 1.05rem; }

.message.ai .message-bubble ul,
.message.ai .message-bubble ol {
  padding-left: 20px;
  margin: 8px 0;
}
.message.ai .message-bubble li { margin-bottom: 4px; }

.message.ai .message-bubble strong { color: var(--text-primary); font-weight: 600; }
.message.ai .message-bubble em { color: var(--text-secondary); font-style: italic; }

.message.ai .message-bubble a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

.message.ai .message-bubble blockquote {
  border-left: 3px solid var(--accent);
  padding: 6px 14px;
  margin: 10px 0;
  background: var(--accent-dim);
  border-radius: 0 8px 8px 0;
  color: var(--text-secondary);
}

.message.ai .message-bubble hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }

.message.ai .message-bubble table {
  width: 100%;
  border-collapse: collapse;
  margin: 12px 0;
  font-size: 13.5px;
}
.message.ai .message-bubble th,
.message.ai .message-bubble td {
  padding: 8px 12px;
  border: 1px solid var(--border);
  text-align: left;
}
.message.ai .message-bubble th {
  background: var(--accent-dim);
  color: var(--accent);
  font-weight: 600;
}
.message.ai .message-bubble tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

/* Inline code */
.message-bubble code:not(pre code) {
  font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
  background: rgba(0,212,170,0.1);
  color: var(--accent);
  padding: 1px 6px;
  border-radius: 5px;
  font-size: 13px;
}
[data-theme="light"] .message-bubble code:not(pre code) {
  background: rgba(0,136,112,0.08);
}

/* Code blocks */
.code-block {
  position: relative;
  margin: 10px 0;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--border);
  background: #0d1117;
}
[data-theme="light"] .code-block { background: #1e2736; }

.code-block-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 14px;
  background: rgba(255,255,255,0.04);
  border-bottom: 1px solid var(--border);
}
.code-lang {
  font-size: 11px;
  font-family: 'SF Mono', monospace;
  color: var(--text-muted);
  text-transform: lowercase;
}
.copy-code-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  padding: 3px 10px;
  background: rgba(0,212,170,0.08);
  border: 1px solid rgba(0,212,170,0.2);
  border-radius: 6px;
  color: var(--accent);
  cursor: pointer;
  font-family: var(--font-body);
  transition: background var(--t-fast), color var(--t-fast);
}
.copy-code-btn:hover { background: rgba(0,212,170,0.15); }
.copy-code-btn svg { width: 12px; height: 12px; }

.code-block pre {
  margin: 0 !important;
  border: none !important;
  border-radius: 0 !important;
  padding: 14px 16px !important;
  overflow-x: auto;
  font-size: 13px !important;
  background: transparent !important;
  font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace !important;
}
.code-block pre code { background: none !important; padding: 0 !important; font-size: 13px !important; }

/* ─── Message Actions ────────────────────────────────────── */
.message-actions {
  display: flex;
  gap: 4px;
  margin-top: 5px;
  opacity: 0;
  transition: opacity var(--t-fast);
}
.message:hover .message-actions { opacity: 1; }

.msg-action-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 4px 9px;
  background: transparent;
  border: none;
  border-radius: 7px;
  color: var(--text-muted);
  font-size: 12px;
  font-family: var(--font-body);
  cursor: pointer;
  transition: background var(--t-fast), color var(--t-fast);
}
.msg-action-btn svg { width: 13px; height: 13px; }
.msg-action-btn:hover { background: var(--accent-dim); color: var(--accent); }
.msg-action-btn.copied { color: var(--accent); }

/* ─── Typing Indicator ───────────────────────────────────── */
.typing-indicator {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 20px;
}
.typing-dots { display: flex; gap: 5px; align-items: center; }
.typing-dots span {
  width: 7px; height: 7px;
  background: var(--accent);
  border-radius: 50%;
  animation: bounceTyping 1.3s ease-in-out infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.16s; }
.typing-dots span:nth-child(3) { animation-delay: 0.32s; }
@keyframes bounceTyping {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.45; }
  30% { transform: translateY(-7px); opacity: 1; }
}
.typing-label { font-size: 12.5px; color: var(--text-muted); }

/* ─── Input Area ─────────────────────────────────────────── */
.input-area {
  padding: 13px 18px 15px;
  padding-bottom: max(15px, env(safe-area-inset-bottom, 15px));
  background: var(--nav-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  position: relative;
  z-index: 10;
  transition: background var(--t-normal);
}

.input-wrapper {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 10px 10px 10px 18px;
  max-width: 780px;
  margin: 0 auto;
  transition: border-color 0.18s, box-shadow 0.18s;
}
.input-wrapper:focus-within {
  border-color: var(--border-accent);
  box-shadow: 0 0 0 3px var(--accent-dim);
}

#userInput {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  resize: none;
  font-family: var(--font-body);
  font-size: 14.5px;
  line-height: 1.55;
  color: var(--text-primary);
  max-height: 200px;
  overflow-y: auto;
  padding: 2px 0;
  scrollbar-width: none;
}
#userInput::placeholder { color: var(--text-muted); }
#userInput::-webkit-scrollbar { display: none; }

.send-btn {
  width: 38px; height: 38px;
  border-radius: 10px;
  border: none;
  background: var(--accent);
  color: #000;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 0 20px var(--accent-glow);
  transition: opacity var(--t-normal), transform 0.12s, box-shadow var(--t-normal);
}
.send-btn svg { width: 17px; height: 17px; }
.send-btn:not(:disabled):hover { opacity: 0.85; transform: scale(1.07); box-shadow: 0 0 30px var(--accent-strong); }
.send-btn:not(:disabled):active { transform: scale(0.95); }
.send-btn:disabled { background: var(--text-muted); box-shadow: none; cursor: not-allowed; opacity: 0.45; }

.input-footer {
  text-align: center;
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 8px;
  max-width: 780px;
  margin-left: auto;
  margin-right: auto;
}

/* ─── Overlay ────────────────────────────────────────────── */
.overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.52);
  z-index: 150;
  backdrop-filter: blur(3px);
}
.overlay.active { display: block; }

/* ─── Toast ──────────────────────────────────────────────── */
.toast {
  position: fixed;
  bottom: 96px;
  left: 50%;
  transform: translateX(-50%) translateY(12px);
  font-size: 13px;
  padding: 9px 16px;
  border-radius: 10px;
  opacity: 0;
  visibility: hidden;
  transition: all var(--t-normal);
  z-index: 1000;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  white-space: nowrap;
  pointer-events: none;
}
.toast.error { color: #f87171; background: rgba(248,113,113,0.09); border: 1px solid rgba(248,113,113,0.2); }
.toast.success { color: var(--accent); background: var(--accent-dim); border: 1px solid var(--border-accent); }
.toast.visible { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

/* ─── Mobile ─────────────────────────────────────────────── */
@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    left: 0; top: 0; bottom: 0;
    transform: translateX(-100%);
    box-shadow: 0 0 60px rgba(0,0,0,0.6);
  }
  .sidebar.open { transform: translateX(0); }
  .menu-toggle { display: flex; }
  .header-center { justify-content: flex-start; margin-left: 8px; }
  .suggestion-grid { grid-template-columns: 1fr 1fr; }
  .message-bubble { font-size: 14px; }
  .message { padding: 4px 14px; }
  .welcome-screen h1 { font-size: clamp(1.6rem, 7vw, 2.4rem); }
  .input-area { padding: 10px 12px max(14px, env(safe-area-inset-bottom, 14px)); }
  .msg-wrap { max-width: 90%; }
}
@media (max-width: 480px) {
  .suggestion-grid { grid-template-columns: 1fr; }
}
</style>

<script>
/* ══════════════════════════════════════════════════════════
   Daivy AI – Enhanced Script
   ══════════════════════════════════════════════════════════ */

// ── Config ───────────────────────────────────────────────
const MODEL   = 'claude-sonnet-4-20250514';
const API_URL = 'https://api.anthropic.com/v1/messages';
const SYSTEM  = `You are Daivy AI, a smart, friendly, and highly capable AI assistant. 
Be helpful, concise, and clear. Use markdown for formatting when appropriate — headings, 
bold, code blocks, lists — to make responses readable. For code, always specify the language.`;

// ── State ────────────────────────────────────────────────
let sessions       = [];      // [{ id, title, messages }]
let activeId       = null;    // current session id
let isStreaming    = false;
let streamInterval = null;

// ── DOM refs ─────────────────────────────────────────────
const sidebar          = document.getElementById('sidebar');
const overlay          = document.getElementById('overlay');
const historyList      = document.getElementById('historyList');
const messagesContainer= document.getElementById('messagesContainer');
const welcomeScreen    = document.getElementById('welcomeScreen');
const chatContainer    = document.getElementById('chatContainer');
const userInput        = document.getElementById('userInput');
const sendBtn          = document.getElementById('sendBtn');
const toast            = document.getElementById('toast');

// ── Init ─────────────────────────────────────────────────
(function init() {
  loadSessions();
  setupMarked();
  bindEvents();
  updateThemeIcon();
})();

// ── Marked.js config ─────────────────────────────────────
function setupMarked() {
  if (!window.marked) return;
  marked.setOptions({
    breaks: true,
    gfm: true,
    highlight: (code, lang) => {
      if (window.hljs && lang && hljs.getLanguage(lang)) {
        return hljs.highlight(code, { language: lang }).value;
      }
      return window.hljs ? hljs.highlightAuto(code).value : code;
    }
  });
}

// ── Event bindings ────────────────────────────────────────
function bindEvents() {
  // Sidebar open/close
  document.getElementById('menuToggle').addEventListener('click', () => toggleSidebar(true));
  overlay.addEventListener('click', () => toggleSidebar(false));

  // New chat
  document.getElementById('newChatBtn').addEventListener('click', startNewChat);

  // Clear all
  document.getElementById('clearAllBtn').addEventListener('click', () => {
    if (!confirm('Delete all conversations?')) return;
    sessions = []; activeId = null;
    saveSessions(); renderHistory(); showWelcome();
  });

  // Theme
  document.getElementById('themeToggle').addEventListener('click', toggleTheme);
  document.getElementById('themeToggleSide').addEventListener('click', toggleTheme);

  // Textarea
  userInput.addEventListener('input', () => {
    autoResize(userInput);
    sendBtn.disabled = !userInput.value.trim() || isStreaming;
  });

  userInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) handleSend();
    }
  });

  sendBtn.addEventListener('click', handleSend);

  // Suggestion cards
  document.querySelectorAll('.suggestion-card').forEach(card => {
    card.addEventListener('click', () => {
      const prompt = card.dataset.prompt;
      userInput.value = prompt;
      autoResize(userInput);
      sendBtn.disabled = false;
      handleSend();
    });
  });
}

// ── Sidebar ───────────────────────────────────────────────
function toggleSidebar(open) {
  sidebar.classList.toggle('open', open);
  overlay.classList.toggle('active', open);
}

// ── Theme ─────────────────────────────────────────────────
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.dataset.theme === 'dark';
  html.dataset.theme = isDark ? 'light' : 'dark';
  localStorage.setItem('daivy-theme', html.dataset.theme);
  updateThemeIcon();
  // Swap hljs stylesheet
  const hljsLink = document.getElementById('hljs-theme');
  if (hljsLink) {
    hljsLink.href = isDark
      ? 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css'
      : 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css';
  }
}
function updateThemeIcon() {
  const isDark = document.documentElement.dataset.theme === 'dark';
  const icon = document.getElementById('themeIcon');
  if (!icon) return;
  icon.innerHTML = isDark
    ? '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>'
    : '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';
}

// Restore saved theme
const savedTheme = localStorage.getItem('daivy-theme');
if (savedTheme) { document.documentElement.dataset.theme = savedTheme; updateThemeIcon(); }

// ── Sessions (localStorage) ───────────────────────────────
function saveSessions() {
  localStorage.setItem('daivy-sessions', JSON.stringify(sessions));
}
function loadSessions() {
  try {
    const raw = localStorage.getItem('daivy-sessions');
    if (raw) sessions = JSON.parse(raw);
  } catch { sessions = []; }
  renderHistory();
  if (sessions.length) loadSession(sessions[sessions.length - 1].id);
  else showWelcome();
}
function startNewChat() {
  showWelcome();
  activeId = null;
  toggleSidebar(false);
}
function loadSession(id) {
  const session = sessions.find(s => s.id === id);
  if (!session) return;
  activeId = id;
  renderHistory();
  showMessages();
  messagesContainer.innerHTML = '';
  session.messages.forEach(m => {
    if (m.role === 'user') appendUserMessage(m.content, false);
    else appendAiMessage(m.content, false);
  });
  scrollToBottom();
  toggleSidebar(false);
}
function getActiveSession() {
  return sessions.find(s => s.id === activeId);
}
function createSession(firstMsg) {
  const id = Date.now().toString();
  const title = firstMsg.slice(0, 42) + (firstMsg.length > 42 ? '…' : '');
  const session = { id, title, messages: [] };
  sessions.push(session);
  activeId = id;
  saveSessions();
  renderHistory();
  return session;
}

// ── History list ──────────────────────────────────────────
function renderHistory() {
  historyList.innerHTML = '';
  [...sessions].reverse().forEach(session => {
    const li = document.createElement('li');
    li.className = 'history-item' + (session.id === activeId ? ' active' : '');
    li.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
      </svg>
      <span>${escHtml(session.title)}</span>
      <button class="del-btn" title="Delete" data-id="${session.id}">✕</button>`;
    li.addEventListener('click', e => {
      if (e.target.classList.contains('del-btn') || e.target.closest('.del-btn')) return;
      loadSession(session.id);
    });
    li.querySelector('.del-btn').addEventListener('click', e => {
      e.stopPropagation();
      deleteSession(session.id);
    });
    historyList.appendChild(li);
  });
}
function deleteSession(id) {
  sessions = sessions.filter(s => s.id !== id);
  if (activeId === id) { activeId = null; showWelcome(); }
  saveSessions();
  renderHistory();
}

// ── UI state ──────────────────────────────────────────────
function showWelcome() {
  welcomeScreen.style.display = 'flex';
  messagesContainer.classList.remove('visible');
  messagesContainer.innerHTML = '';
}
function showMessages() {
  welcomeScreen.style.display = 'none';
  messagesContainer.classList.add('visible');
}

// ── Message rendering ─────────────────────────────────────
function appendUserMessage(text, save = true) {
  showMessages();
  const div = document.createElement('div');
  div.className = 'message user';
  div.innerHTML = `
    <div class="msg-wrap">
      <div class="message-bubble">${escHtml(text)}</div>
      <div class="message-actions">
        <button class="msg-action-btn" onclick="copyText(this,'${escAttr(text)}')">
          ${iconCopy()} Copy
        </button>
      </div>
    </div>`;
  messagesContainer.appendChild(div);
  if (save) {
    let session = getActiveSession();
    if (!session) session = createSession(text);
    session.messages.push({ role: 'user', content: text });
    saveSessions();
  }
  scrollToBottom();
}

function appendAiMessage(text, save = true) {
  const div = document.createElement('div');
  div.className = 'message ai';
  const html = renderMarkdown(text);
  div.innerHTML = `
    <div class="ai-avatar">D</div>
    <div class="msg-wrap">
      <div class="message-bubble">${html}</div>
      <div class="message-actions">
        <button class="msg-action-btn" onclick="copyText(this,${JSON.stringify(text)})">
          ${iconCopy()} Copy
        </button>
      </div>
    </div>`;
  messagesContainer.appendChild(div);
  // Highlight code
  div.querySelectorAll('pre code').forEach(block => {
    if (window.hljs) hljs.highlightElement(block);
  });
  if (save) {
    const session = getActiveSession();
    if (session) {
      session.messages.push({ role: 'assistant', content: text });
      saveSessions();
    }
  }
  scrollToBottom();
  return div;
}

function appendTypingIndicator() {
  const div = document.createElement('div');
  div.className = 'typing-indicator';
  div.id = 'typingIndicator';
  div.innerHTML = `
    <div class="ai-avatar" style="width:30px;height:30px;font-size:11px;flex-shrink:0;">D</div>
    <div class="typing-dots">
      <span></span><span></span><span></span>
    </div>`;
  messagesContainer.appendChild(div);
  scrollToBottom();
  return div;
}
function removeTypingIndicator() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

// ── Streaming typewriter ──────────────────────────────────
function typewriterEffect(msgDiv, fullText) {
  const bubble = msgDiv.querySelector('.message-bubble');
  const chars  = [...fullText];
  let i = 0, current = '';

  return new Promise(resolve => {
    clearInterval(streamInterval);
    streamInterval = setInterval(() => {
      const chunk = Math.min(4, chars.length - i);
      current += chars.slice(i, i + chunk).join('');
      i += chunk;
      bubble.innerHTML = renderMarkdown(current);
      bubble.querySelectorAll('pre code').forEach(b => { if (window.hljs) hljs.highlightElement(b); });
      scrollToBottom();
      if (i >= chars.length) {
        clearInterval(streamInterval);
        // Final render
        bubble.innerHTML = renderMarkdown(fullText);
        bubble.querySelectorAll('pre code').forEach(b => { if (window.hljs) hljs.highlightElement(b); });
        scrollToBottom();
        resolve();
      }
    }, 12);
  });
}

// ── Main send flow ────────────────────────────────────────
async function handleSend() {
  const text = userInput.value.trim();
  if (!text || isStreaming) return;

  userInput.value = '';
  autoResize(userInput);
  sendBtn.disabled = true;
  isStreaming = true;

  appendUserMessage(text);
  showMessages();
  appendTypingIndicator();

  try {
    const session = getActiveSession();
    const history = session ? session.messages.map(m => ({
      role: m.role === 'assistant' ? 'assistant' : 'user',
      content: m.content
    })) : [{ role: 'user', content: text }];

    // If session was just created this turn, history includes our message already.
    // Make sure we don't double-add.
    const apiMessages = session && session.messages.length > 1
      ? history
      : [{ role: 'user', content: text }];

    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 1000,
        system: SYSTEM,
        messages: apiMessages
      })
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${response.status}`);
    }

    const data = await response.json();
    const reply = data.content?.find(b => b.type === 'text')?.text || '';

    removeTypingIndicator();

    // Create placeholder AI message div for typewriter
    const msgDiv = document.createElement('div');
    msgDiv.className = 'message ai';
    msgDiv.innerHTML = `
      <div class="ai-avatar">D</div>
      <div class="msg-wrap">
        <div class="message-bubble"></div>
        <div class="message-actions">
          <button class="msg-action-btn" onclick="copyText(this,${JSON.stringify(reply)})">
            ${iconCopy()} Copy
          </button>
        </div>
      </div>`;
    messagesContainer.appendChild(msgDiv);
    scrollToBottom();

    await typewriterEffect(msgDiv, reply);

    // Save
    const ses = getActiveSession();
    if (ses) {
      ses.messages.push({ role: 'assistant', content: reply });
      saveSessions();
    }

  } catch (err) {
    removeTypingIndicator();
    showToast('Error: ' + (err.message || 'Something went wrong'), 'error');
  } finally {
    isStreaming = false;
    sendBtn.disabled = !userInput.value.trim();
  }
}

// ── Markdown rendering ────────────────────────────────────
function renderMarkdown(text) {
  if (!window.marked) return escHtml(text).replace(/\n/g, '<br>');

  // Pre-process: wrap code blocks with custom header
  let html = marked.parse(text);

  // Replace bare <pre><code ...> with code-block wrapper
  html = html.replace(
    /<pre><code class="(language-(\w+))">([\s\S]*?)<\/code><\/pre>/g,
    (_, cls, lang, code) => `
      <div class="code-block">
        <div class="code-block-header">
          <span class="code-lang">${lang}</span>
          <button class="copy-code-btn" onclick="copyCode(this)">
            ${iconCopy()} Copy code
          </button>
        </div>
        <pre><code class="${cls}">${code}</code></pre>
      </div>`
  );

  // Handle code blocks with no language
  html = html.replace(
    /<pre><code>([\s\S]*?)<\/code><\/pre>/g,
    (_, code) => `
      <div class="code-block">
        <div class="code-block-header">
          <span class="code-lang">code</span>
          <button class="copy-code-btn" onclick="copyCode(this)">
            ${iconCopy()} Copy code
          </button>
        </div>
        <pre><code>${code}</code></pre>
      </div>`
  );

  return html;
}

// ── Helpers ───────────────────────────────────────────────
function scrollToBottom() {
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 200) + 'px';
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escAttr(str) {
  return str.replace(/'/g, "\\'").replace(/\n/g, ' ');
}

function showToast(msg, type = 'error') {
  toast.textContent = msg;
  toast.className = `toast ${type} visible`;
  setTimeout(() => { toast.classList.remove('visible'); }, 3500);
}

function copyText(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    btn.classList.add('copied');
    const orig = btn.innerHTML;
    btn.innerHTML = `${iconCheck()} Copied`;
    setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('copied'); }, 1800);
  }).catch(() => showToast('Copy failed', 'error'));
}

function copyCode(btn) {
  const code = btn.closest('.code-block').querySelector('code');
  const text = code.innerText || code.textContent;
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.innerHTML;
    btn.innerHTML = `${iconCheck()} Copied!`;
    setTimeout(() => { btn.innerHTML = orig; }, 1800);
  }).catch(() => showToast('Copy failed', 'error'));
}

function iconCopy() {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
  </svg>`;
}
function iconCheck() {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
    <polyline points="20 6 9 17 4 12"/>
  </svg>`;
}
</script>
