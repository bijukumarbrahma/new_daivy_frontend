<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daivy AI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap"
    rel="stylesheet">

  <!-- Markdown + Syntax highlighting -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"
    id="hljs-theme">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app-container">

    <!-- ── Sidebar ── -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="#" class="logo">
          <div class="logo-mark">D</div>
          <span class="logo-name">Daivy AI</span>
        </a>
        <button class="new-chat-btn" id="newChatBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14" />
          </svg>
          New conversation
        </button>
      </div>

      <div class="chat-history">
        <div class="history-label">Recent</div>
        <ul class="history-list" id="historyList"></ul>
      </div>

      <div class="sidebar-footer">
        <button class="sidebar-action-btn" id="themeToggleSide">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5" />
            <path
              d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
          </svg>
          Toggle theme
        </button>
        <button class="sidebar-action-btn danger" id="clearAllBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6" />
            <path d="M19 6l-1 14H6L5 6" />
            <path d="M10 11v6M14 11v6" />
            <path d="M9 6V4h6v2" />
          </svg>
          Clear all chats
        </button>
      </div>
    </aside>

    <!-- ── Main ── -->
    <div class="main-content">

      <!-- Header -->
      <header class="chat-header">
        <button class="menu-toggle" id="menuToggle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>

        <div class="header-center">
          <div class="logo">
            <div class="logo-mark">D</div>
            <span class="logo-text">Daivy <span>AI</span></span>
          </div>
        </div>

        <div class="header-actions">
          <button class="icon-btn" id="themeToggle" title="Toggle theme">
            <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
            </svg>
          </button>
        </div>
      </header>

      <!-- Chat -->
      <div class="chat-container" id="chatContainer">

        <!-- Welcome -->
        <div class="welcome-screen" id="welcomeScreen">
          <div class="welcome-icon">D</div>
          <h1>Ask me anything.</h1>
          <p>I'm Daivy AI — your intelligent companion for code, ideas, writing, and everything in between.</p>

          <div class="suggestion-grid">
            <button class="suggestion-card"
              data-prompt="Explain how neural networks work in a simple, intuitive way with an analogy.">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10" />
                <path d="M12 16v-4M12 8h.01" />
              </svg>
              <div>
                <div class="card-title">Explain a concept</div>
                <div class="card-sub">Neural networks, quantum computing…</div>
              </div>
            </button>

            <button class="suggestion-card"
              data-prompt="Write a Python function that implements binary search with detailed comments.">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="16 18 22 12 16 6" />
                <polyline points="8 6 2 12 8 18" />
              </svg>
              <div>
                <div class="card-title">Write code</div>
                <div class="card-sub">Functions, algorithms, snippets…</div>
              </div>
            </button>

            <button class="suggestion-card"
              data-prompt="Give me 5 creative and unique startup ideas in the sustainability space with a brief description for each.">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon
                  points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
              </svg>
              <div>
                <div class="card-title">Generate ideas</div>
                <div class="card-sub">Brainstorm, startup concepts…</div>
              </div>
            </button>

            <button class="suggestion-card"
              data-prompt="What are the most important web development best practices in 2025? Include performance, security, and accessibility tips.">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z" />
                <path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z" />
              </svg>
              <div>
                <div class="card-title">Learn something</div>
                <div class="card-sub">Best practices, tips, guides…</div>
              </div>
            </button>
          </div>
        </div>

        <!-- Messages -->
        <div class="messages-container" id="messagesContainer"></div>

      </div>

      <!-- Input -->
      <div class="input-area">
        <div class="input-wrapper">
          <textarea id="userInput" placeholder="Message Daivy AI…" rows="1"></textarea>
          <button class="send-btn" id="sendBtn" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <line x1="22" y1="2" x2="11" y2="13" />
              <polygon points="22 2 15 22 11 13 2 9 22 2" />
            </svg>
          </button>
        </div>
        <p class="input-footer">AI can make mistakes. Double-check important information.</p>
      </div>

    </div>
  </div>

  <div class="overlay" id="overlay"></div>
  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>

</html>
